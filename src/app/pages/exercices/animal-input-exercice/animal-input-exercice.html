<div class="mx-auto max-w-6xl p-4 sm:p-8">
  <h1 class="text-center text-3xl font-bold sm:text-4xl">
    <span aria-hidden="true">🐾</span> Refuge Animalier — Exercice Input
  </h1>
  <p class="mt-3 mb-8 text-center">
    Communication Parent → Enfant avec <code class="font-mono">input()</code> et
    <code class="font-mono">input.required()</code>.
  </p>

  <ul class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3">
    @for (animal of animals(); track animal.id) {
      <li class="flex">
        <app-animal-card
          class="w-full"
          [name]="animal.name"
          [species]="animal.species"
          [age]="animal.age"
          [energy]="animal.energy"
          [isAdopted]="animal.isAdopted"
        />
      </li>
    }
  </ul>
  <section class="mt-10">
        <h2 class="mb-4 text-center text-2xl font-bold">Nouvel arrivant</h2>
        <div class="mx-auto max-w-sm">
            <app-animal-card 
              name="Rouky"
              species="Chien" />
        </div>
  </section>
</div>
