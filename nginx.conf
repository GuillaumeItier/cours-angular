server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve existing assets directly, and route Angular client-side paths to the app.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed production assets can be cached for a long time.
    location ~* \.(?:css|js|woff2?|png|jpe?g|gif|svg|ico|webp)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Basic response hardening.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
